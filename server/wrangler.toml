# KuCards online rooms: one Worker + one Durable Object per room (free plan compatible). Separate from Kudominoes.
name = "kucards-rooms"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the online catalog of player-made game modes (one object)
[[durable_objects.bindings]]
name = "MODES"
class_name = "ModeStore"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ModeStore"]

[observability]
enabled = true
