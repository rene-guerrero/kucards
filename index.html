    <title>KuCards</title>
    <style>
      /* critical boot styles so nothing flashes white before the CSS bundle loads */
      html, body { margin: 0; height: 100%; background: #13232e; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      /* the same cards as the game and the menu: a Ku back and a face, fanned */
      #boot .boot-fan { position: relative; width: 104px; height: 100px; animation: bootpulse 1.1s ease-in-out infinite; }
      #boot .bc { position: absolute; top: 5px; width: 60px; height: 90px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
      #boot .bc svg { display: block; width: 60px; height: 90px; }
      #boot .bc-back { left: 4px; transform: rotate(-12deg); }
      #boot .bc-face { left: 40px; transform: rotate(10deg); }
      @keyframes bootpulse { 50% { transform: scale(0.92) rotate(-4deg); opacity: 0.8; } }
      /* the menu paints before the 3D table (renderer chunk loads behind it): the table fades in when ready */
      #table { opacity: 0; transition: opacity .7s ease; }
      #table.kc-ready { opacity: 1; }
      /* early-menu tap while the game is still loading */
      .btn.is-loading { position: relative; pointer-events: none; }
      .btn.is-loading > * { opacity: 0.3; }
      .btn.is-loading::after {
        content: ''; position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
        border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent;
        animation: kcspin .7s linear infinite;
      }
      @keyframes kcspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #table { transition: none; } #boot .boot-fan { animation: none; } }
    </style>
  </head>

    <div id="ui"></div>

      </div>

    <script>
      /* Boot watchdog (plain script, runs even if the game bundle fails to load or parse — e.g. a stale
         cached copy referencing files a newer deploy removed, or a very old browser). If the splash is
         still up after a few seconds, offer a retry that drops the service worker + caches and reloads. */
      (function () {
        var shown = false;
        function offerRetry() {
          var boot = document.getElementById('boot');
          if (shown || !boot || !boot.parentNode) return;
          shown = true;
          // same rule as the game (settings.ts): a language picked in Ajustes, else the device's first es/en
          var es = false;
          try {
            var saved = JSON.parse(localStorage.getItem('kucards.settings.v1') || 'null');
            var chosen = saved && (saved.language === 'es' || saved.language === 'en') &&
              (typeof saved.languageChosen === 'boolean' ? saved.languageChosen : saved.language !== 'es');
            if (chosen) es = saved.language === 'es';
            else {
              var ls = [].concat(navigator.languages || [], navigator.language || '');
              for (var i = 0; i < ls.length; i++) {
                var tag = String(ls[i]).toLowerCase();
                if (tag.indexOf('es') === 0) { es = true; break; }
                if (tag.indexOf('en') === 0) break;
              }
            }
          } catch (e) { /* storage blocked: English */ }
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:0;right:0;bottom:18%;display:flex;flex-direction:column;align-items:center;gap:12px;font:600 15px system-ui,sans-serif;color:#f3e7cf;text-align:center;padding:0 24px';
          var msg = document.createElement('p');
          msg.style.margin = '0';
          msg.textContent = es ? 'El juego está tardando en cargar.' : 'The game is taking a while to load.';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = es ? 'Reintentar' : 'Retry';
          btn.style.cssText = 'min-height:44px;padding:0 26px;border:0;border-radius:14px;background:#ffc53d;color:#3a2410;font:800 16px system-ui,sans-serif;cursor:pointer';
          btn.onclick = function () {
            btn.disabled = true;
            var jobs = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
          };
          box.appendChild(msg);
          box.appendChild(btn);
          boot.appendChild(box);
        }
        setTimeout(offerRetry, 12000);
        /* a module script that fails to load fires 'error' on the element (captured here) */
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el.tagName === 'SCRIPT') setTimeout(offerRetry, 1500);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
